repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: go-mod-tidy
      - id: go-unit-tests

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.3.1
    hooks:
      - id: golangci-lint
        args: [--timeout=5m]
