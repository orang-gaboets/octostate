repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: go-mod-tidy
      - id: go-unit-tests

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: go
        args: [run, github.com/rhysd/actionlint/cmd/actionlint@v1.7.12]
        language: system
        files: ^\.github/workflows/.*\.(ya?ml)$

      - id: govulncheck
        name: govulncheck
        entry: go
        args: [run, golang.org/x/vuln/cmd/govulncheck@v1.5.0, ./...]
        language: system
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: [--timeout=5m]
