name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        # golangci/golangci-lint-action v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          args: --timeout=5m

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate pinned GitHub App action inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          app_token_action='actions/create-github-app-token'
          if ! action_refs="$(
            rg -No "uses: ${app_token_action}@[^[:space:]]+" .github/workflows \
              | sed 's/.*@//' \
              | sort -u
          )"; then
            echo 'Expected at least one create-github-app-token use.' >&2
            exit 1
          fi
          if [ -z "$action_refs" ] || [[ "$action_refs" == *$'\n'* ]]; then
            echo "Expected exactly one pinned create-github-app-token ref." >&2
            exit 1
          fi
          action_sha="$action_refs"
          if [[ ! "$action_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "create-github-app-token must use a full commit SHA, got $action_sha." >&2
            exit 1
          fi

          metadata_root="$(mktemp -d)"
          trap 'rm -rf "$metadata_root"' EXIT
          mkdir -p "$metadata_root/.git" "$metadata_root/.github/workflows" "$metadata_root/$app_token_action/dist"
          gh api \
            "repos/$app_token_action/contents/action.yml?ref=$action_sha" \
            --jq '.content' \
            | base64 --decode > "$metadata_root/$app_token_action/action.yml"
          touch "$metadata_root/$app_token_action/dist/main.cjs" \
            "$metadata_root/$app_token_action/dist/post.cjs"

          for workflow in .github/workflows/*.yml; do
            sed "s#${app_token_action}@$action_sha#./$app_token_action#g" \
              "$workflow" > "$metadata_root/.github/workflows/$(basename "$workflow")"
          done

          (
            cd "$metadata_root"
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          )

  release-approval-gate:
    name: Release approval gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Bash syntax
        run: |
          bash -n .github/scripts/release-approval-gate.sh
          bash -n .github/scripts/release-approval-gate.test.sh
          bash -n .github/scripts/git-remote-auth.sh
          bash -n .github/scripts/git-remote-auth.test.sh

      - name: Run ShellCheck v0.11.0
        run: >
          docker run --rm
          --volume "$PWD:/mnt"
          --workdir /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x
          -P SCRIPTDIR
          .github/scripts/release-approval-gate.sh
          .github/scripts/release-approval-gate.test.sh
          .github/scripts/git-remote-auth.sh
          .github/scripts/git-remote-auth.test.sh

      - name: Test release approval gate
        run: bash .github/scripts/release-approval-gate.test.sh

      - name: Test Git remote authentication helper
        run: bash .github/scripts/git-remote-auth.test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -cover -coverprofile=coverage.out

  gitops-race:
    name: GitOps race detector
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        # The bounded-concurrency GitOps engine is the highest-risk area for shared-memory races.
        run: go test -race ./pkg/gitops/...

  windows-config:
    name: Windows config replacement
    runs-on: windows-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Test config replacement packages
        run: go test ./cmd/octostate/internal/filereplace ./cmd/octostate/internal/configproposal ./cmd/octostate/config
