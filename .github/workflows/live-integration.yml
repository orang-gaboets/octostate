name: Trusted Live Integration

on:
  workflow_dispatch:

concurrency:
  group: octostate-test-live-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trusted-dispatch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      trusted_sha: ${{ steps.trust.outputs.sha }}
    steps:
      - name: Check out dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted main commit
        id: trust
        run: .github/scripts/verify-trusted-main.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate committed fixture
        run: go run ./cmd/octostate config validate --config-dir testdata/live-integration

  live-integration:
    needs: trusted-dispatch
    if: ${{ needs.trusted-dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: octostate-test
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-dispatch.outputs.trusted_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify mutation checkout
        env:
          TRUSTED_SHA: ${{ needs.trusted-dispatch.outputs.trusted_sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
      - name: Create read-scoped live-test installation token
        id: readonly-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OCTOSTATE_TEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.OCTOSTATE_TEST_APP_PRIVATE_KEY }}
          owner: octostate-test
          repositories: octostate-fixture-repo
          permission-administration: read
          permission-members: read
          permission-metadata: read
      - name: Run read-only integration scenarios
        env:
          GH_TOKEN: ${{ steps.readonly-token.outputs.token }}
          OCTOSTATE_GITHUB_TOKEN: ${{ steps.readonly-token.outputs.token }}
        run: .github/scripts/live-integration.sh --read-only
      - name: Revoke read-only token and clear environment
        env:
          GH_TOKEN: ${{ steps.readonly-token.outputs.token }}
          OCTOSTATE_GITHUB_TOKEN: ${{ steps.readonly-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE /installation/token >/dev/null
          unset GH_TOKEN OCTOSTATE_GITHUB_TOKEN
      - name: Create write-scoped live-test installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OCTOSTATE_TEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.OCTOSTATE_TEST_APP_PRIVATE_KEY }}
          owner: octostate-test
          repositories: octostate-fixture-repo
          permission-administration: write
          permission-members: read
          permission-metadata: read
      - name: Run mutation and restoration scenarios
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OCTOSTATE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/live-integration.sh --mutate
