name: Go vulnerability monitoring

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "24 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Scheduled and manual runs detect newly disclosed vulnerabilities; they do not remediate them.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...
