name: Auto-merge Release Please PRs

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - synchronize

concurrency:
  # Only release-ready approval events share the cancellation bucket.
  # Unrelated label noise and bot cleanup events run separately.
  group: "release-please-auto-merge-${{ github.event.pull_request.number }}-${{ github.event.action == 'synchronize' && 'approval' || github.event.label.name == (vars.RELEASE_READY_LABEL || 'release: ready') && github.event.action == 'labeled' && 'approval' || github.event.label.name == (vars.RELEASE_READY_LABEL || 'release: ready') && github.event.action == 'unlabeled' && github.event.sender.type != 'Bot' && 'approval' || github.event.label.name == (vars.RELEASE_READY_LABEL || 'release: ready') && github.event.action == 'unlabeled' && 'bot-cleanup' || github.event.action == 'labeled' && 'other-label' || 'other-unlabel' }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  RELEASE_APPROVER_ORG: orang-gaboets
  RELEASE_APPROVER_TEAM: octostate-publishers
  RELEASE_READY_LABEL: "${{ vars.RELEASE_READY_LABEL || 'release: ready' }}"

jobs:
  auto-merge:
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--') &&
      github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        env:
          RELEASE_PLEASE_APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        if: env.RELEASE_PLEASE_APP_ID != '' && env.RELEASE_PLEASE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-checks: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read
          permission-members: read

      - name: Fail if app credentials are unavailable
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "RELEASE_PLEASE_APP_ID and RELEASE_PLEASE_APP_PRIVATE_KEY must be configured for release PR auto-merge." >&2
          exit 1

      - name: Verify release-please PR actor
        env:
          EXPECTED_BOT: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [ "$PR_AUTHOR" != "$EXPECTED_BOT" ]; then
            echo "Expected release PR author $EXPECTED_BOT, got $PR_AUTHOR" >&2
            exit 1
          fi

      - name: Evaluate release approval
        id: release-approval
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EXPECTED_BOT: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_APPROVER_ORG: ${{ env.RELEASE_APPROVER_ORG }}
          RELEASE_APPROVER_TEAM: ${{ env.RELEASE_APPROVER_TEAM }}
          RELEASE_READY_LABEL: ${{ env.RELEASE_READY_LABEL }}
        run: |
          set -euo pipefail

          should_merge=false
          has_release_ready=false
          if jq -e --arg label "$RELEASE_READY_LABEL" 'any(.[]; .name == $label)' <<<"$PR_LABELS_JSON" >/dev/null; then
            has_release_ready=true
          fi

          case "$EVENT_ACTION" in
            labeled)
              if [ "$EVENT_LABEL" != "$RELEASE_READY_LABEL" ]; then
                echo "Ignoring label event for $EVENT_LABEL; only $RELEASE_READY_LABEL can approve a release PR."
                echo "should_merge=$should_merge" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              authorized=false
              if [ "$EVENT_SENDER" != "$EXPECTED_BOT" ]; then
                team_stderr="$(mktemp)"
                team_status=0
                gh api "/orgs/$RELEASE_APPROVER_ORG/teams/$RELEASE_APPROVER_TEAM" --jq '.slug' > /dev/null 2>"$team_stderr" || team_status=$?
                if [ "$team_status" -ne 0 ]; then
                  echo "Failed to verify release approver team @$RELEASE_APPROVER_ORG/$RELEASE_APPROVER_TEAM." >&2
                  echo "Confirm the team slug is correct and the release-please app has Members: read." >&2
                  cat "$team_stderr" >&2
                  rm -f "$team_stderr"
                  exit 1
                fi
                rm -f "$team_stderr"

                membership_stderr="$(mktemp)"
                membership_status=0
                team_state="$(gh api "/orgs/$RELEASE_APPROVER_ORG/teams/$RELEASE_APPROVER_TEAM/memberships/$EVENT_SENDER" --jq '.state' 2>"$membership_stderr")" || membership_status=$?
                if [ "$membership_status" -eq 0 ] && [ "$team_state" = "active" ]; then
                  authorized=true
                elif [ "$membership_status" -ne 0 ]; then
                  if ! grep -q "(HTTP 404)" "$membership_stderr"; then
                    echo "Failed to verify whether @$EVENT_SENDER is a release approver." >&2
                    echo "Leaving $RELEASE_READY_LABEL in place; confirm the app token can read organization members and retry." >&2
                    cat "$membership_stderr" >&2
                    rm -f "$membership_stderr"
                    exit 1
                  fi
                fi
                rm -f "$membership_stderr"
              fi

              if [ "$authorized" != true ]; then
                echo "$RELEASE_READY_LABEL was applied by @$EVENT_SENDER, but only active members of @$RELEASE_APPROVER_ORG/$RELEASE_APPROVER_TEAM may approve release auto-merge." >&2
                label_removed=false
                if gh pr edit "$PR_URL" --remove-label "$RELEASE_READY_LABEL"; then
                  label_removed=true
                else
                  echo "Failed to remove unauthorized $RELEASE_READY_LABEL label from PR #$PR_NUMBER." >&2
                fi

                if [ "$label_removed" = true ]; then
                  comment_status="The label was removed automatically and this PR was not merged."
                else
                  comment_status="This PR was not merged. The workflow also failed to remove the label automatically, so a maintainer should remove it manually."
                fi

                printf -v comment_body '%s\n\n%s\n\n%s\n' \
                  "\`$RELEASE_READY_LABEL\` was applied by @$EVENT_SENDER, but only active members of [@$RELEASE_APPROVER_ORG/$RELEASE_APPROVER_TEAM](https://github.com/orgs/$RELEASE_APPROVER_ORG/teams/$RELEASE_APPROVER_TEAM) may approve release auto-merge." \
                  "$comment_status" \
                  "An authorized Octostate Publisher should review the release PR and re-apply \`$RELEASE_READY_LABEL\` if it is ready to publish."

                if ! gh pr comment "$PR_URL" --body "$comment_body"; then
                  echo "Failed to post unauthorized approval comment on PR #$PR_NUMBER." >&2
                fi
                exit 1
              fi

              should_merge=true
              ;;
            synchronize)
              if [ "$has_release_ready" = true ]; then
                echo "Removing stale $RELEASE_READY_LABEL approval after PR update."
                gh pr edit "$PR_URL" --remove-label "$RELEASE_READY_LABEL"
              fi
              ;;
            unlabeled)
              ;;
            *)
              echo "Ignoring unsupported release approval event: $EVENT_ACTION"
              ;;
          esac

          echo "should_merge=$should_merge" >> "$GITHUB_OUTPUT"

      - name: Wait for release checks
        if: ${{ steps.release-approval.outputs.should_merge == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail

          timeout_seconds=1800
          poll_interval_seconds=10
          deadline=$(( $(date +%s) + timeout_seconds ))

          while true; do
            checks_stderr="$(mktemp)"
            checks_status=0
            # gh returns non-zero while checks are pending or failed, but still emits JSON.
            checks_json="$(gh pr checks "$PR_URL" --json name,bucket,workflow 2>"$checks_stderr")" || checks_status=$?
            if ! jq -e 'type == "array"' <<<"$checks_json" >/dev/null; then
              if grep -Eiq 'no checks? (reported|found)' "$checks_stderr" && [ "$(date +%s)" -lt "$deadline" ]; then
                echo "Waiting for release checks to be reported:"
                cat "$checks_stderr"
                rm -f "$checks_stderr"
                sleep "$poll_interval_seconds"
                continue
              fi

              echo "gh pr checks did not return valid check JSON." >&2
              cat "$checks_stderr" >&2
              rm -f "$checks_stderr"
              if [ "$checks_status" -eq 0 ]; then
                checks_status=1
              fi
              exit "$checks_status"
            fi
            rm -f "$checks_stderr"

            relevant_checks_json="$(jq --arg workflow "$WORKFLOW_NAME" '[.[] | select(.workflow != $workflow)]' <<<"$checks_json")"
            relevant_check_count="$(jq 'length' <<<"$relevant_checks_json")"

            missing_required_workflows=""
            for required_workflow in CI "CodeQL Security" "Go vulnerability monitoring"; do
              if ! jq -e --arg workflow "$required_workflow" 'any(.[]; .workflow == $workflow)' <<<"$relevant_checks_json" >/dev/null; then
                missing_required_workflows="${missing_required_workflows}${required_workflow}"$'\n'
              fi
            done

            if [ "$relevant_check_count" -eq 0 ] || [ -n "$missing_required_workflows" ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Timed out waiting for required release checks to start." >&2
                printf '%s' "$missing_required_workflows" >&2
                exit 1
              fi

              echo "Waiting for required release checks to start:"
              printf '%s' "$missing_required_workflows"
              sleep "$poll_interval_seconds"
              continue
            fi

            failed_checks="$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | .[].name' <<<"$relevant_checks_json")"
            if [ -n "$failed_checks" ]; then
              echo "Release checks failed:" >&2
              printf '%s\n' "$failed_checks" >&2
              exit 1
            fi

            pending_checks="$(jq -r '[.[] | select(.bucket == "pending")] | .[].name' <<<"$relevant_checks_json")"
            if [ -z "$pending_checks" ]; then
              break
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for release checks to complete." >&2
              printf '%s\n' "$pending_checks" >&2
              exit 1
            fi

            echo "Waiting for release checks to complete:"
            printf '%s\n' "$pending_checks"
            sleep "$poll_interval_seconds"
          done

      - name: Merge release-please PR
        if: ${{ steps.release-approval.outputs.should_merge == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --admin --squash --delete-branch --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
