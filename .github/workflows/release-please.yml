name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag to package on retry'
        required: false
        type: string
      release_commit:
        description: 'Expected commit for release_tag when retrying'
        required: false
        type: string
      verify_git_auth:
        description: 'Run a read-only GitHub Git authentication check on main'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-please-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults; id-token and
    # attestations are only for the build provenance step.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Validate retry inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          RETRY_TAG: ${{ inputs.release_tag }}
          RETRY_COMMIT: ${{ inputs.release_commit }}
          VERIFY_GIT_AUTH: ${{ inputs.verify_git_auth }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${VERIFY_GIT_AUTH}" == 'true' ]]; then
            [[ "${DISPATCH_REF}" == 'refs/heads/main' ]] || {
              echo 'verify_git_auth can only run from main' >&2
              exit 1
            }
            [[ -z "${RETRY_TAG}" && -z "${RETRY_COMMIT}" ]] || {
              echo 'verify_git_auth cannot be combined with release retry inputs' >&2
              exit 1
            }
          fi
          [[ -n "${RETRY_TAG}" && -n "${RETRY_COMMIT}" ]] ||
            [[ -z "${RETRY_TAG}" && -z "${RETRY_COMMIT}" ]] || {
              echo 'release_tag and release_commit must be supplied together' >&2
              exit 1
            }

      - name: Generate GitHub App token
        id: app-token
        env:
          RELEASE_PLEASE_APP_CLIENT_ID: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        if: env.RELEASE_PLEASE_APP_CLIENT_ID != '' && env.RELEASE_PLEASE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        id: release-please
        if: github.event_name != 'workflow_dispatch' || (inputs.release_tag == '' && inputs.verify_git_auth != true)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release to package
        id: release
        env:
          CREATED_TAG: ${{ steps.release-please.outputs.tag_name }}
          CREATED_COMMIT: ${{ steps.release-please.outputs.sha }}
          RETRY_TAG: ${{ inputs.release_tag }}
          RETRY_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          tag=''
          commit=''
          if [[ -n "${CREATED_TAG}" ]]; then
            [[ -n "${CREATED_COMMIT}" ]] || {
              echo 'release-please returned a tag without its release commit' >&2
              exit 1
            }
            tag="${CREATED_TAG}"
            commit="${CREATED_COMMIT}"
          elif [[ -n "${RETRY_TAG}" ]]; then
            tag="${RETRY_TAG}"
            commit="${RETRY_COMMIT}"
          fi
          if [[ -n "${tag}" ]]; then
            [[ -n "${commit}" ]] || { echo 'release retry requires release_commit' >&2; exit 1; }
            {
              printf 'tag=%s\n' "${tag}"
              printf 'commit=%s\n' "${commit}"
              printf 'should_package=true\n'
            } >> "$GITHUB_OUTPUT"
          else
            printf 'should_package=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Release Please Git authentication
        if: github.event_name == 'workflow_dispatch' && inputs.verify_git_auth == true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_CREDENTIAL_SOURCE: ${{ steps.app-token.outputs.token != '' && 'release-app' || 'GITHUB_TOKEN' }}
        run: |
          set -euo pipefail
          git_with_release_token() (
            set +x
            set -euo pipefail
            local app_token="${GH_TOKEN-}"
            local encoded_token auth_header config_variable trace_variable
            local auth_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

            [[ -n "${app_token}" ]] || { echo 'GH_TOKEN is required for Git authentication' >&2; exit 1; }
            unset GH_TOKEN GIT_CURL_VERBOSE GIT_CONFIG_PARAMETERS GIT_SSL_NO_VERIFY
            for config_variable in ${!GIT_CONFIG_KEY_@} ${!GIT_CONFIG_VALUE_@}; do
              unset "${config_variable}"
            done
            export GIT_CONFIG_COUNT=0
            export GIT_TERMINAL_PROMPT=0
            export GIT_ASKPASS=/bin/false
            export SSH_ASKPASS=/bin/false
            export GCM_INTERACTIVE=never
            for trace_variable in \
              GIT_TRACE GIT_TRACE_CURL GIT_TRACE_FSMONITOR GIT_TRACE_PACK_ACCESS \
              GIT_TRACE_PACKET GIT_TRACE_PACKFILE GIT_TRACE_PERFORMANCE GIT_TRACE_REFS \
              GIT_TRACE_SETUP GIT_TRACE_SHALLOW GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF; do
              export "${trace_variable}=0"
            done
            unset GIT_TRACE2_CONFIG_PARAMS GIT_TRACE2_ENV_VARS
            export GIT_TRACE_REDACT=1

            encoded_token="$(printf 'x-access-token:%s' "${app_token}" | base64 | tr -d '\r\n')"
            auth_header="AUTHORIZATION: Basic ${encoded_token}"
            unset app_token encoded_token
            OCTOSTATE_GIT_AUTH_HEADER="${auth_header}" git \
              -c "http.${auth_url}.extraheader=" \
              --config-env="http.${auth_url}.extraheader=OCTOSTATE_GIT_AUTH_HEADER" \
              -c "http.${auth_url}.followredirects=false" \
              -c "http.${auth_url}.sslVerify=true" \
              -c credential.helper= \
              -c credential.interactive=false \
              "$@"
          )
          main_ref=$(git_with_release_token ls-remote --exit-code --heads \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main \
            | awk '$2 == "refs/heads/main" { print $2 }')
          [[ "${main_ref}" == 'refs/heads/main' ]] || {
            echo 'GitHub Git authentication check did not return refs/heads/main' >&2
            exit 1
          }
          printf 'GitHub Git authentication check passed using %s.\n' "${RELEASE_CREDENTIAL_SOURCE}"

      - name: Check out the exact release tag
        if: steps.release.outputs.should_package == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set +x
          set -euo pipefail
          release_token="${GH_TOKEN-}"
          unset GH_TOKEN
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git_with_release_token() (
            set +x
            set -euo pipefail
            local app_token="${release_token-}"
            local encoded_token auth_header config_variable trace_variable
            local auth_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

            [[ -n "${app_token}" ]] || { echo 'GH_TOKEN is required for Git authentication' >&2; exit 1; }
            unset GH_TOKEN GIT_CURL_VERBOSE GIT_CONFIG_PARAMETERS GIT_SSL_NO_VERIFY
            for config_variable in ${!GIT_CONFIG_KEY_@} ${!GIT_CONFIG_VALUE_@}; do
              unset "${config_variable}"
            done
            export GIT_CONFIG_COUNT=0
            export GIT_TERMINAL_PROMPT=0
            export GIT_ASKPASS=/bin/false
            export SSH_ASKPASS=/bin/false
            export GCM_INTERACTIVE=never
            for trace_variable in \
              GIT_TRACE GIT_TRACE_CURL GIT_TRACE_FSMONITOR GIT_TRACE_PACK_ACCESS \
              GIT_TRACE_PACKET GIT_TRACE_PACKFILE GIT_TRACE_PERFORMANCE GIT_TRACE_REFS \
              GIT_TRACE_SETUP GIT_TRACE_SHALLOW GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF; do
              export "${trace_variable}=0"
            done
            unset GIT_TRACE2_CONFIG_PARAMS GIT_TRACE2_ENV_VARS
            export GIT_TRACE_REDACT=1

            encoded_token="$(printf 'x-access-token:%s' "${app_token}" | base64 | tr -d '\r\n')"
            auth_header="AUTHORIZATION: Basic ${encoded_token}"
            unset app_token encoded_token
            OCTOSTATE_GIT_AUTH_HEADER="${auth_header}" git \
              -c "http.${auth_url}.extraheader=" \
              --config-env="http.${auth_url}.extraheader=OCTOSTATE_GIT_AUTH_HEADER" \
              -c "http.${auth_url}.followredirects=false" \
              -c "http.${auth_url}.sslVerify=true" \
              -c credential.helper= \
              -c credential.interactive=false \
              "$@"
          )
          git_with_release_token fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          unset release_token
          git checkout --detach "${RELEASE_TAG}"
          [[ -n "${EXPECTED_COMMIT}" ]] || { echo 'retry requires release_commit' >&2; exit 1; }
          [[ "$(git rev-parse "HEAD^{commit}")" == "${EXPECTED_COMMIT}" ]] || {
            echo "release tag ${RELEASE_TAG} does not target expected commit ${EXPECTED_COMMIT}" >&2
            exit 1
          }

      - name: Set up Go
        if: steps.release.outputs.should_package == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        if: steps.release.outputs.should_package == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/build-release-artifacts.sh "${RELEASE_TAG}" dist

      - name: Attest release archive build provenance
        if: steps.release.outputs.should_package == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/octostate_*.tar.gz
            dist/octostate_*.zip

      - name: Verify release archive build provenance
        if: steps.release.outputs.should_package == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name 'octostate_*.tar.gz' -o -name 'octostate_*.zip' \) -print | sort)
          [[ "${#assets[@]}" -eq 5 ]] || { echo 'expected exactly five release archives' >&2; exit 1; }
          for asset in "${assets[@]}"; do
            gh attestation verify "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-please.yml" \
              --source-digest "${SOURCE_DIGEST}" \
              --deny-self-hosted-runners
          done

      - name: Upload and verify release artifacts
        if: steps.release.outputs.should_package == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c checksums.txt)
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name 'octostate_*.tar.gz' -o -name 'octostate_*.zip' \) -print | sort)
          [[ "${#assets[@]}" -eq 5 ]] || { echo 'expected exactly five release archives' >&2; exit 1; }
          archive_names=$(printf '%s\n' "${assets[@]}" | sed 's#^dist/##' | jq -Rsc 'split("\n")[:-1]')
          jq -Rse --argjson expected "${archive_names}" '
            split("\n") | if last == "" then .[:-1] else . end |
            map(if test("^[0-9a-fA-F]{64}  [^/]+$") then .[66:] else error("invalid checksum entry") end) |
            sort == ($expected | sort)
          ' dist/checksums.txt >/dev/null || {
            echo 'checksum manifest does not cover exactly the release archives' >&2
            exit 1
          }
          expected_names=$(printf '%s\n' "${assets[@]}" dist/checksums.txt | sed 's#^dist/##' | jq -Rsc 'split("\n")[:-1]')
          releases=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          release_id=$(jq -er --arg tag "${RELEASE_TAG}" '
            if type == "array" and all(.[]; type == "array") then . else error("invalid release pages") end |
            [ .[][] | select(.tag_name == $tag) ] |
            if length == 1 and (.[0].draft == true) and
               (.[0].id | type == "number" and . > 0 and . == floor)
            then .[0].id else error("expected exactly one matching draft release") end
          ' <<<"${releases}")

          git_with_release_token() (
            set +x
            set -euo pipefail
            local app_token="${GH_TOKEN-}"
            local encoded_token auth_header config_variable trace_variable
            local auth_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

            [[ -n "${app_token}" ]] || { echo 'GH_TOKEN is required for Git authentication' >&2; exit 1; }
            unset GH_TOKEN GIT_CURL_VERBOSE GIT_CONFIG_PARAMETERS GIT_SSL_NO_VERIFY
            for config_variable in ${!GIT_CONFIG_KEY_@} ${!GIT_CONFIG_VALUE_@}; do
              unset "${config_variable}"
            done
            export GIT_CONFIG_COUNT=0
            export GIT_TERMINAL_PROMPT=0
            export GIT_ASKPASS=/bin/false
            export SSH_ASKPASS=/bin/false
            export GCM_INTERACTIVE=never
            for trace_variable in \
              GIT_TRACE GIT_TRACE_CURL GIT_TRACE_FSMONITOR GIT_TRACE_PACK_ACCESS \
              GIT_TRACE_PACKET GIT_TRACE_PACKFILE GIT_TRACE_PERFORMANCE GIT_TRACE_REFS \
              GIT_TRACE_SETUP GIT_TRACE_SHALLOW GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF; do
              export "${trace_variable}=0"
            done
            unset GIT_TRACE2_CONFIG_PARAMS GIT_TRACE2_ENV_VARS
            export GIT_TRACE_REDACT=1

            encoded_token="$(printf 'x-access-token:%s' "${app_token}" | base64 | tr -d '\r\n')"
            auth_header="AUTHORIZATION: Basic ${encoded_token}"
            unset app_token encoded_token
            OCTOSTATE_GIT_AUTH_HEADER="${auth_header}" git \
              -c "http.${auth_url}.extraheader=" \
              --config-env="http.${auth_url}.extraheader=OCTOSTATE_GIT_AUTH_HEADER" \
              -c "http.${auth_url}.followredirects=false" \
              -c "http.${auth_url}.sslVerify=true" \
              -c credential.helper= \
              -c credential.interactive=false \
              "$@"
          )
          verify_release_tag() {
            local peeled
            peeled=$(git_with_release_token ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}') || return 1
            if [[ -z "${peeled}" ]]; then
              peeled=$(git_with_release_token ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
                "refs/tags/${RELEASE_TAG}" | awk '{print $1}') || return 1
            fi
            [[ "${peeled}" == "${EXPECTED_COMMIT}" ]] || {
              echo "release tag ${RELEASE_TAG} moved before publication; refusing to publish artifacts" >&2
              return 1
            }
          }
          read_verified_release() {
            local release
            release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}") || return 1
            jq -e --arg tag "${RELEASE_TAG}" --argjson id "${release_id}" \
              --arg url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --arg upload "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets{?name,label}" \
              '.id == $id and .tag_name == $tag and .draft == true and .url == $url and .upload_url == $upload' \
              <<<"${release}" >/dev/null || {
                echo 'release identity or draft state changed; refusing to publish' >&2
                return 1
              }
            verify_release_tag || return 1
            printf '%s\n' "${release}"
          }
          read_assets() {
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" |
              jq -ce 'if type == "array" and all(.[]; type == "array") then add // [] else error("invalid asset pages") end'
          }
          validate_assets() {
            jq -e --argjson expected "${expected_names}" '
              all(.[]; (.name | type == "string") and
                (.id | type == "number" and . > 0 and . == floor) and
                (.name as $name | $expected | index($name) != null)) and
              ([.[].name] | length == (unique | length)) and
              ([.[].id] | length == (unique | length))
            ' <<<"$1" >/dev/null || {
              echo 'release contains unexpected or duplicate assets; refusing to publish' >&2
              return 1
            }
          }

          release_json=$(read_verified_release)
          remote_assets=$(read_assets)
          validate_assets "${remote_assets}"
          for asset in "${assets[@]}" dist/checksums.txt; do
            name=$(basename "${asset}")
            asset_id=$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' <<<"${remote_assets}")
            if [[ -n "${asset_id}" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done
          upload_url=$(jq -r '.upload_url | sub("\\{\\?name,label\\}$"; "")' <<<"${release_json}")
          for asset in "${assets[@]}" dist/checksums.txt; do
            name=$(basename "${asset}")
            gh api --method POST --input "${asset}" -H 'Content-Type: application/octet-stream' \
              -f "name=${name}" "${upload_url}" >/dev/null
          done
          rm -rf remote-assets
          mkdir remote-assets
          release_json=$(read_verified_release)
          remote_assets=$(read_assets)
          validate_assets "${remote_assets}"
          verified_assets=$(jq -ce --argjson expected "${expected_names}" '
            if ([.[].name] | sort) == ($expected | sort) and all(.[]; .state == "uploaded")
            then sort_by(.name) | map({name, id, state})
            else error("release contains unexpected, missing, or unuploaded assets") end
          ' <<<"${remote_assets}")
          for asset in "${assets[@]}" dist/checksums.txt; do
            name=$(basename "${asset}")
            asset_id=$(jq -er --arg name "${name}" '.[] | select(.name == $name) | .id' <<<"${remote_assets}")
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "remote-assets/${name}"
          done
          (cd remote-assets && sha256sum -c ../dist/checksums.txt)
          cmp -s dist/checksums.txt remote-assets/checksums.txt || {
            echo 'uploaded checksum manifest differs from the local manifest' >&2
            exit 1
          }
          release_json=$(read_verified_release)
          remote_assets=$(read_assets)
          validate_assets "${remote_assets}"
          final_assets=$(jq -c 'sort_by(.name) | map({name, id, state})' <<<"${remote_assets}")
          [[ "${final_assets}" == "${verified_assets}" ]] || {
            echo 'release assets changed after verification; refusing to publish' >&2
            exit 1
          }
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -f "tag_name=${RELEASE_TAG}" >/dev/null
