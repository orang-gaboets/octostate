name: Octostate Config Review

on:
  workflow_call:
    inputs:
      config_dir:
        description: Directory containing organization.yaml
        required: false
        default: ./config
        type: string
      expected_org:
        description: Independently expected organization for live plan and preflight when binding is enabled
        required: false
        default: ''
        type: string
      bind_expected_org:
        description: Bind live commands to expected_org; false keeps legacy unbound behavior
        required: false
        default: false
        type: boolean
      octostate_version:
        description: Reviewed full 40-character lowercase Octostate commit SHA to build
        required: true
        type: string
    secrets:
      octostate_token:
        description: Token for live Octostate plan and apply preflight operations
        required: true

permissions:
  contents: read

jobs:
  config-review:
    name: Validate, plan, and preflight configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install Octostate
        env:
          OCTOSTATE_VERSION: ${{ inputs.octostate_version }}
          OCTOSTATE_BIN_DIR: ${{ runner.temp }}/octostate-bin
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$OCTOSTATE_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "octostate_version must be a full 40-character lowercase commit SHA; release tags are not accepted" >&2
            exit 1
          fi

          source_dir="$(mktemp -d "$RUNNER_TEMP/octostate-source.XXXXXX")"
          trap 'rm -rf -- "$source_dir"' EXIT
          git -C "$source_dir" init --quiet
          git -C "$source_dir" fetch --quiet --depth=1 --no-tags \
            https://github.com/orang-gaboets/octostate.git "$OCTOSTATE_VERSION"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          if [[ "$(git -C "$source_dir" rev-parse HEAD)" != "$OCTOSTATE_VERSION" ]]; then
            echo "Octostate source commit does not match octostate_version" >&2
            exit 1
          fi

          mkdir -p "$OCTOSTATE_BIN_DIR"
          (
            cd "$source_dir"
            GOWORK=off go build -mod=readonly -buildvcs=true \
              -o "$OCTOSTATE_BIN_DIR/octostate" ./cmd/octostate
          )
          build_info="$(go version -m "$OCTOSTATE_BIN_DIR/octostate")"
          binary_revision="$(awk '$1 == "build" && sub(/^vcs.revision=/, "", $2) { print $2 }' <<< "$build_info")"
          binary_modified="$(awk '$1 == "build" && sub(/^vcs.modified=/, "", $2) { print $2 }' <<< "$build_info")"
          if [[ "$binary_revision" != "$OCTOSTATE_VERSION" || "$binary_modified" != "false" ]]; then
            echo "Octostate binary must identify the requested commit and an unmodified source tree" >&2
            exit 1
          fi
          printf 'Verified Octostate source commit: %s\n%s\n' "$OCTOSTATE_VERSION" "$build_info" >&2
          printf '%s\n' "$OCTOSTATE_BIN_DIR" >> "$GITHUB_PATH"

      - name: Validate configuration
        env:
          CONFIG_DIR: ${{ inputs.config_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CONFIG_DIR" ]]; then
            echo "config_dir must not be empty" >&2
            exit 1
          fi

          octostate config validate --config-dir "$CONFIG_DIR"

      - name: Plan configuration
        env:
          CONFIG_DIR: ${{ inputs.config_dir }}
          OCTOSTATE_TOKEN: ${{ secrets.octostate_token }}
          EXPECTED_ORG: ${{ inputs.expected_org }}
          BIND_EXPECTED_ORG: ${{ inputs.bind_expected_org }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$OCTOSTATE_TOKEN" ]]; then
            echo "octostate_token is required for config plan" >&2
            exit 1
          fi
          if [[ "$BIND_EXPECTED_ORG" != "true" && -n "$EXPECTED_ORG" ]]; then
            echo "expected_org requires bind_expected_org: true" >&2
            exit 1
          fi

          set --
          if [[ "$BIND_EXPECTED_ORG" == "true" ]]; then
            set -- --expected-org "$EXPECTED_ORG"
          fi

          octostate config plan --config-dir "$CONFIG_DIR" --token "$OCTOSTATE_TOKEN" "$@"

      - name: Preflight configuration apply
        env:
          CONFIG_DIR: ${{ inputs.config_dir }}
          OCTOSTATE_TOKEN: ${{ secrets.octostate_token }}
          EXPECTED_ORG: ${{ inputs.expected_org }}
          BIND_EXPECTED_ORG: ${{ inputs.bind_expected_org }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$OCTOSTATE_TOKEN" ]]; then
            echo "octostate_token is required for config apply --check" >&2
            exit 1
          fi
          if [[ "$BIND_EXPECTED_ORG" != "true" && -n "$EXPECTED_ORG" ]]; then
            echo "expected_org requires bind_expected_org: true" >&2
            exit 1
          fi

          set --
          if [[ "$BIND_EXPECTED_ORG" == "true" ]]; then
            set -- --expected-org "$EXPECTED_ORG"
          fi

          octostate config apply --config-dir "$CONFIG_DIR" --token "$OCTOSTATE_TOKEN" --check "$@"
