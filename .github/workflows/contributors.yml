name: Contributor showcase

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only by default. The single job that can open a pull request raises its
# own permissions below, and nothing here needs administration access.
permissions:
  contents: read

concurrency:
  group: contributor-showcase
  cancel-in-progress: false

jobs:
  update:
    name: Refresh contributor showcase
    runs-on: ubuntu-latest
    # A manual dispatch can select any ref. This job runs repository code with a
    # write-capable token, so it is restricted to main and checks main out
    # explicitly rather than trusting the dispatched ref.
    if: github.ref == 'refs/heads/main'
    permissions:
      # Push the update branch.
      contents: write
      # Open the pull request that carries it.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate contributor showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/contributors -repository "${GITHUB_REPOSITORY}"

      - name: Open a pull request when the showcase changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "Contributor showcase is already up to date."
            exit 0
          fi

          branch="chore/contributor-showcase"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add README.md
          git commit -m "docs: refresh contributor showcase"

          # The checkout only fetches main, so there is no remote-tracking ref
          # for the automation branch and a bare --force-with-lease would be
          # rejected as "stale info". Read the current remote value and pass it
          # as an explicit lease instead.
          #
          # Query the fully qualified ref: ls-remote patterns match the tail of
          # a ref name, so a bare "$branch" would also match something like
          # refs/heads/foo/$branch and return two SHAs, which is not a usable
          # lease value.
          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"

          # One push covers both cases. A SHA gives the usual compare-and-swap;
          # an empty expected value asserts the ref does not exist yet, so a
          # branch created between the lookup above and this push is rejected
          # rather than silently fast-forwarded over.
          git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "$branch"

          # Reuse the open pull request when one already exists so repeated
          # scheduled runs do not accumulate duplicates.
          #
          # Captured in its own statement rather than inside the test below: a
          # failing lookup inside [[ -n "$(...)" ]] is indistinguishable from an
          # empty result under set -e, and would fall through to creating a
          # duplicate. --head does not accept <owner>:<branch>, so the base is
          # constrained and cross-repository heads are filtered out explicitly.
          existing_pr="$(
            gh pr list \
              --base main \
              --head "$branch" \
              --state open \
              --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Existing pull request #${existing_pr} updated."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: refresh contributor showcase" \
            --body "Regenerated by the contributor showcase workflow. Only the marked README region changes."
